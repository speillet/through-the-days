[package]
name = "through-the-days"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "through_the_days_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
journal-core = { path = "../../../crates/journal-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# The mock runtime runs an open copy of the app in a test to check the single-instance guard.
tauri = { version = "2", features = ["test"] }
# Real temporary journals and crafted older or foreign databases for the shell's flow tests.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
