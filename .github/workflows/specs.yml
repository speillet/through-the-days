name: Specifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate proposed specifications
        run: npm run spec:validate
      - name: Reject incomplete archived changes
        run: npm run openspec -- validate --archived --no-interactive
